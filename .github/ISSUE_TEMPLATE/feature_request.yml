name: Feature request
description: Propose a problem for KsCollectionView to solve
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your idea. You may write your answers in English or Japanese.

  - type: textarea
    id: problem_to_solve
    attributes:
      label: Problem to solve
      description: Describe the concrete problem or unmet need.
    validations:
      required: true

  - type: textarea
    id: current_impact
    attributes:
      label: Current impact
      description: Explain how the current behavior or workflow makes things difficult for you today.
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives considered
      description: List the approaches or workarounds you considered and their trade-offs.
    validations:
      required: true
