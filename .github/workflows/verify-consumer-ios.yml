# iOS の利用者の立場のビルドの確認 (再利用 workflow)
#
# 配布物を、利用者と同じ書き方 (SwiftPM の package の product への依存) で取る利用者役
# (verification/ios/) を、リリースの構成で、Simulator 向けと実機向けの 2 つの行き先にビルドする。
# 本体と Sample のビルドは verify-ios.yml が確かめる。Sample は本体のソースを直接参照するので、
# 配布物だけが壊れたことには、ここでしか気付けない。
#
# 配布物をどこから取るかは、入力 mode で決まる。ビルドと成功の条件は、どれでも同じである。
# - local: 今の ios/ から作った写しを、パスで参照する。version は使わない
# - artifact: 同じ run の artifact (名前を入力 artifact に渡す) を取り込み、その写しをパスで
#   参照する。写しは作らない。version は使わない。artifact の中身は、配信用リポジトリのルートに
#   置くのと同じ写し (ルートに Package.swift・Sources/・Tests/・LICENSE・README.md) とする
# - published: 配信用リポジトリの、version に渡した版を参照する
#
# 準備からビルドまでは scripts/ci/verify-consumer-ios.py が行う。入力が範囲の外
# (知らない mode・published で version が無い・artifact の写しにマニフェストが無い) のときも、
# スクリプトが何も始めずに失敗で終わる。artifact の名前の過不足だけは、取り込みの前に
# Check inputs が確かめる (名前が空のまま取り込むと、run のすべての artifact を取り込むため)。
#
# Simulator は選ばず、起動もしない (cross/ADR-0013)。ビルドの行き先は、特定の端末を指さない
# 総称の指定である。認証の情報は受け取らず、何も書き込まない。
name: verify consumer ios

on:
  workflow_call:
    inputs:
      mode:
        description: "配布物をどこから取るか (local | artifact | published)"
        type: string
        required: true
      version:
        description: "取る版 (published では必須。local と artifact では使わない)"
        type: string
        required: false
        default: ""
      artifact:
        description: "取り込む artifact の名前 (artifact では必須。ほかの切り替えでは渡さない)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # Xcode はメジャーとマイナーで決め、パッチはランナーのイメージにある版に任せる。
  # verify-ios.yml と同じ値にする。版を上げるときは、両方を同時に変える。
  KS_XCODE_VERSION: "27.0"

jobs:
  verify:
    name: verify
    # Xcode 27 を持つのは、専用のイメージ xcode-27 である。
    runs-on: xcode-27
    # 既定の 360 分は長すぎる。xcodebuild の停止で、macOS のランナーを占有し続けないための上限。
    # ランナーでの所要時間は 2 分ほどで、外部の依存の取得の遅れを見込んだ上限を置く。
    # 既存の 2 つの検証の上限と揃えてある。
    timeout-minutes: 15

    steps:
      # artifact の名前の過不足を、ほかの準備より前に確かめる。取り込みの step は、名前が空だと
      # run のすべての artifact を取り込むので、取り込みの前にここで止める。
      # 入力は、式を本文に直に埋めずに、環境変数を通して渡す (値がシェルの構文として読まれない)。
      - name: Check inputs
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          if [ "${KS_MODE}" = "artifact" ] && [ -z "${KS_ARTIFACT}" ]; then
            echo "::error::mode が artifact のときは、取り込む artifact の名前を入力 artifact に渡す"
            exit 1
          fi
          if [ "${KS_MODE}" != "artifact" ] && [ -n "${KS_ARTIFACT}" ]; then
            echo "::error::入力 artifact は、mode が artifact のときだけ渡す (mode: ${KS_MODE})"
            exit 1
          fi

      # 写しを作る道具は、git が追跡しているファイルの一覧を読む。履歴は要らない。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 確認のスクリプトは、PATH の上の xcodebuild をそのまま使い、版を自分では確かめない。
      # 決めた版を選ぶところまでを、スクリプトより前のここで行う。
      - name: Select Xcode
        run: |
          set -euo pipefail
          # 決めた版に当たる Xcode のうち、パッチが最も新しいものを選ぶ。
          # 無ければ、別の版で黙って走らせずに、ここで止める。
          app=$(find /Applications -maxdepth 1 -name "Xcode_${KS_XCODE_VERSION}*.app" | sort -V | tail -n 1)
          if [ -z "$app" ]; then
            echo "::error::Xcode ${KS_XCODE_VERSION} がランナーに無い"
            find /Applications -maxdepth 1 -name "Xcode*.app" | sort
            exit 1
          fi
          echo "DEVELOPER_DIR=${app}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          swift --version
          python3 --version
          # 選んだ Xcode が、名前どおりの版であることを確かめる。
          actual=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          case "$actual" in
            "${KS_XCODE_VERSION}" | "${KS_XCODE_VERSION}".*) ;;
            *)
              echo "::error::選んだ Xcode の版が ${KS_XCODE_VERSION} でない (実際: ${actual:-不明})"
              exit 1
              ;;
          esac

      # artifact のときだけ、同じ run の artifact を取り込む。名前を渡した 1 つの artifact は、
      # 中身が path の直下に展開される。
      - name: Download artifact
        if: ${{ inputs.mode == 'artifact' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/consumer-artifact/KsCollectionView-SPM

      # 入力は、式を本文に直に埋めずに、環境変数を通して渡す (値がシェルの構文として読まれない)。
      # version と KS_SNAPSHOT が空のときは空の文字列が渡り、スクリプトは渡していないのと同じに扱う。
      # KS_SNAPSHOT は、artifact のときだけ、上で取り込んだディレクトリを指す。
      # 合否はスクリプトの終了コードで決まる。後ろに別のコマンドをつなぐと、つないだ側の
      # 終了コードが step の合否になるので、つながない。
      - name: Verify consumer
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_VERSION: ${{ inputs.version }}
          KS_SNAPSHOT: ${{ inputs.mode == 'artifact' && format('{0}/consumer-artifact/KsCollectionView-SPM', runner.temp) || '' }}
        run: python3 scripts/ci/verify-consumer-ios.py --mode "${KS_MODE}" --version "${KS_VERSION}" --snapshot "${KS_SNAPSHOT}"
