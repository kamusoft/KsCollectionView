# iOS の利用者の立場のビルドの確認 (再利用 workflow)
#
# 配布物を、利用者と同じ書き方 (SwiftPM の package の product への依存) で取る利用者役
# (verification/ios/) を、リリースの構成で、Simulator 向けと実機向けの 2 つの行き先にビルドする。
# 本体と Sample のビルドは verify-ios.yml が確かめる。Sample は本体のソースを直接参照するので、
# 配布物だけが壊れたことには、ここでしか気付けない。
#
# 配布物をどこから取るかは、入力 mode で決まる。ビルドと成功の条件は、どちらでも同じである。
# - local: 今の ios/ から作った写しを、パスで参照する。version は使わない
# - published: 配信用リポジトリの、version に渡した版を参照する
#
# 準備からビルドまでは scripts/ci/verify-consumer-ios.py が行う。入力が範囲の外
# (知らない mode・published で version が無い) のときも、スクリプトが何も始めずに失敗で終わる。
#
# Simulator は選ばず、起動もしない (cross/ADR-0013)。ビルドの行き先は、特定の端末を指さない
# 総称の指定である。認証の情報は受け取らず、何も書き込まない。
name: verify consumer ios

on:
  workflow_call:
    inputs:
      mode:
        description: "配布物をどこから取るか (local | published)"
        type: string
        required: true
      version:
        description: "取る版 (published では必須。local では使わない)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # Xcode はメジャーとマイナーで決め、パッチはランナーのイメージにある版に任せる。
  # verify-ios.yml と同じ値にする。版を上げるときは、両方を同時に変える。
  KS_XCODE_VERSION: "27.0"

jobs:
  verify:
    name: verify
    # Xcode 27 を持つのは、専用のイメージ xcode-27 である。
    runs-on: xcode-27
    # 既定の 360 分は長すぎる。xcodebuild の停止で、macOS のランナーを占有し続けないための上限。
    # ランナーでの所要時間は 2 分ほどで、外部の依存の取得の遅れを見込んだ上限を置く。
    # 既存の 2 つの検証の上限と揃えてある。
    timeout-minutes: 15

    steps:
      # 写しを作る道具は、git が追跡しているファイルの一覧を読む。履歴は要らない。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 確認のスクリプトは、PATH の上の xcodebuild をそのまま使い、版を自分では確かめない。
      # 決めた版を選ぶところまでを、スクリプトより前のここで行う。
      - name: Select Xcode
        run: |
          set -euo pipefail
          # 決めた版に当たる Xcode のうち、パッチが最も新しいものを選ぶ。
          # 無ければ、別の版で黙って走らせずに、ここで止める。
          app=$(find /Applications -maxdepth 1 -name "Xcode_${KS_XCODE_VERSION}*.app" | sort -V | tail -n 1)
          if [ -z "$app" ]; then
            echo "::error::Xcode ${KS_XCODE_VERSION} がランナーに無い"
            find /Applications -maxdepth 1 -name "Xcode*.app" | sort
            exit 1
          fi
          echo "DEVELOPER_DIR=${app}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          swift --version
          python3 --version
          # 選んだ Xcode が、名前どおりの版であることを確かめる。
          actual=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          case "$actual" in
            "${KS_XCODE_VERSION}" | "${KS_XCODE_VERSION}".*) ;;
            *)
              echo "::error::選んだ Xcode の版が ${KS_XCODE_VERSION} でない (実際: ${actual:-不明})"
              exit 1
              ;;
          esac

      # 入力は、式を本文に直に埋めずに、環境変数を通して渡す (値がシェルの構文として読まれない)。
      # version が空のときは空の文字列が渡り、スクリプトは渡していないのと同じに扱う。
      # 合否はスクリプトの終了コードで決まる。後ろに別のコマンドをつなぐと、つないだ側の
      # 終了コードが step の合否になるので、つながない。
      - name: Verify consumer
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/verify-consumer-ios.py --mode "${KS_MODE}" --version "${KS_VERSION}"
