# iOS の検証 (再利用 workflow)
#
# 本体のテストを iOS Simulator で全件走らせ、続けて Sample のビルドとユニットテストを走らせる
# (cross/ADR-0013)。入力を取らないので、どの workflow からも同じ内容で呼べる。
#
# macOS の上の `swift test` は、UIKit に依存するテストをコンパイルの対象から外すので、
# 合否の判定には使わない。テストが 1 件も実行されなくても xcodebuild は成功で終わるため、
# 実行件数の検査までをジョブの合否に含める。
name: verify ios

on:
  workflow_call:

permissions:
  contents: read

env:
  # Xcode はメジャーとマイナーで決め、パッチはランナーのイメージにある版に任せる。
  # 版を上げるときは、この値を変える。
  KS_XCODE_VERSION: "27.0"

jobs:
  verify:
    name: verify
    # Xcode 27 を持つのは、専用のイメージ xcode-27 である。
    runs-on: xcode-27
    # 既定の 360 分は長すぎる。Simulator の起動の待ちや xcodebuild の停止で、macOS のランナーを
    # 占有し続けないための上限。暫定の値で、ランナーでの所要時間を測ってから決め直す。
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          # 決めた版に当たる Xcode のうち、パッチが最も新しいものを選ぶ。
          # 無ければ、別の版で黙って走らせずに、ここで止める。
          app=$(find /Applications -maxdepth 1 -name "Xcode_${KS_XCODE_VERSION}*.app" | sort -V | tail -n 1)
          if [ -z "$app" ]; then
            echo "::error::Xcode ${KS_XCODE_VERSION} がランナーに無い"
            find /Applications -maxdepth 1 -name "Xcode*.app" | sort
            exit 1
          fi
          echo "DEVELOPER_DIR=${app}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          swift --version
          # 選んだ Xcode が、名前どおりの版であることを確かめる。
          actual=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          case "$actual" in
            "${KS_XCODE_VERSION}" | "${KS_XCODE_VERSION}".*) ;;
            *)
              echo "::error::選んだ Xcode の版が ${KS_XCODE_VERSION} でない (実際: ${actual:-不明})"
              exit 1
              ;;
          esac

      # 機種の名前はランナーのイメージの更新で変わるので、名前を決め打ちにせず、
      # 使える iPhone のうち OS が最も新しいものを実行のときに選ぶ。
      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(python3 scripts/ci/select-simulator.py)
          echo "KS_SIMULATOR_UDID=${udid}" >> "$GITHUB_ENV"

      # テストが失敗すると、xcodebuild は Simulator からの診断の収集を約 10 分待つ。
      # 失敗の報告が遅れるので、診断の収集を止める。
      - name: Test library
        id: library
        working-directory: ios
        run: |
          python3 ../scripts/ci/run-logged.py --log "${RUNNER_TEMP}/ios-library.log" -- \
            xcodebuild test \
              -scheme KsCollectionView \
              -destination "platform=iOS Simulator,id=${KS_SIMULATOR_UDID}" \
              -configuration Debug \
              -collect-test-diagnostics never

      # テストが失敗したときも件数を残す。テストの step まで進まなかったときは流さない
      # (その場合は、進まなかった理由だけを示す)。
      - name: Check library test count
        if: ${{ !cancelled() && steps.library.outcome != 'skipped' }}
        run: python3 scripts/ci/check-ios-test-count.py --label "iOS 本体" --log "${RUNNER_TEMP}/ios-library.log"

      # 本体のテストが落ちても、Sample の検証は走らせる (両方が壊れているとき、片方を直すまで
      # もう片方が見えない状態にしない)。
      # 通常の検証のスキームを、ユニットテストのターゲットだけに絞る。UI テストは走らせない。
      # アプリと UI テストのターゲットは、スキームのビルドの対象なのでビルドはされる。
      - name: Build sample and test sample units
        id: sample
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        working-directory: samples/ios
        run: |
          python3 ../../scripts/ci/run-logged.py --log "${RUNNER_TEMP}/ios-sample.log" -- \
            xcodebuild test \
              -project KsCollectionViewSamples.xcodeproj \
              -scheme KsCollectionViewSamples \
              -destination "platform=iOS Simulator,id=${KS_SIMULATOR_UDID}" \
              -configuration Debug \
              -only-testing:KsCollectionViewSamplesTests \
              -collect-test-diagnostics never

      - name: Check sample test count
        if: ${{ !cancelled() && steps.sample.outcome != 'skipped' }}
        run: python3 scripts/ci/check-ios-test-count.py --label "iOS Sample" --log "${RUNNER_TEMP}/ios-sample.log"
