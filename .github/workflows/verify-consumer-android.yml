# Android の利用者の立場のビルドの確認 (再利用 workflow)
#
# 配布物を、利用者と同じ書き方 (Maven の座標 1 行の依存) で取る利用者役 (verification/android/) の
# リリースを、コード縮小を有効にして組み立て、実行時の依存に本ライブラリの座標が指定の版で
# 現れることを確かめる。本体と Sample のテストは verify-android.yml が確かめる。Sample は本体の
# ソースを直接参照するので、配布物だけが壊れたことには、ここでしか気付けない。
#
# 配布物をどこから取るかは、入力 mode で決まる。組み立てと成功の条件は、どれでも同じである。
# - local: 今の android/ を、一時のディレクトリの Maven リポジトリへ発行し、そこだけから取る。
#   version が空なら、本体のバージョンカタログの版を使う
# - artifact: 同じ run の artifact (名前を入力 artifact に渡す) を取り込み、その Maven リポジトリ
#   だけから、version に渡した版を取る。発行はしない。artifact の中身は、Maven リポジトリの
#   ルート (その下に jp/kamusoft/kscollectionview/<版>/ がある) とする
# - published: version に渡した版を、Maven Central だけから取る
#
# 準備から確認までは scripts/ci/verify-consumer-android.py が行う。入力が範囲の外
# (知らない mode・published か artifact で version が無い) のときも、スクリプトが何も始めずに
# 失敗で終わる。artifact の名前の過不足だけは、取り込みの前に Check inputs が確かめる
# (名前が空のまま取り込むと、run のすべての artifact を取り込むため)。
#
# エミュレータは使わず、利用者役を起動しない (cross/ADR-0013)。認証の情報と署名の鍵は受け取らず、
# 何も書き込まない。
name: verify consumer android

on:
  workflow_call:
    inputs:
      mode:
        description: "配布物をどこから取るか (local | artifact | published)"
        type: string
        required: true
      version:
        description: "取る版 (published と artifact では必須。local で空なら本体のバージョンカタログの版)"
        type: string
        required: false
        default: ""
      artifact:
        description: "取り込む artifact の名前 (artifact では必須。ほかの切り替えでは渡さない)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: verify
    # ランナーは版を指定した名前で選ぶ。最新を指す名前は、指す実体が予告なく入れ替わる。
    runs-on: ubuntu-24.04
    # 既定の 360 分は長すぎる。ランナーでの所要時間は 3 分ほど (依存のキャッシュが無い状態) で、
    # 外部の依存の取得の遅れを見込んだ上限を置く。既存の 2 つの検証の上限と揃えてある。
    timeout-minutes: 15

    steps:
      # artifact の名前の過不足を、ほかの準備より前に確かめる。取り込みの step は、名前が空だと
      # run のすべての artifact を取り込むので、取り込みの前にここで止める。
      # 入力は、式を本文に直に埋めずに、環境変数を通して渡す (値がシェルの構文として読まれない)。
      - name: Check inputs
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          if [ "${KS_MODE}" = "artifact" ] && [ -z "${KS_ARTIFACT}" ]; then
            echo "::error::mode が artifact のときは、取り込む artifact の名前を入力 artifact に渡す"
            exit 1
          fi
          if [ "${KS_MODE}" != "artifact" ] && [ -n "${KS_ARTIFACT}" ]; then
            echo "::error::入力 artifact は、mode が artifact のときだけ渡す (mode: ${KS_MODE})"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ビルドを動かす JDK は 17 以上であればよく (android/ADR-0008)、確かめてある版の 21 に決める。
      # verify-android.yml と同じ値にする。
      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # 依存の解決の結果と、wrapper が取得する Gradle だけをキャッシュする。
          # ビルドの出力はキャッシュしない。復元された結果を、この実行の結果と取り違える
          # 経路を作らないため。既定の手元の Maven リポジトリもキャッシュしない
          # (確認はそこへ発行せず、そこから取りもしない)。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-consumer-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'verification/android/gradle/wrapper/gradle-wrapper.properties', 'verification/android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-consumer-${{ runner.os }}-

      - name: Show toolchain
        run: |
          java -version
          python3 --version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

      # コンパイル対象の Android SDK がランナーに無ければ取得する。版の宣言元は
      # バージョンカタログ 1 箇所 (利用者役も同じカタログを読む) なので、ここには版を書かずに読む。
      - name: Ensure Android SDK platform
        run: |
          # sdkmanager に同意の入力を流し続ける `yes` は、相手が終わると失敗で終わる。
          # それをパイプ全体の失敗にしないため、ここでは pipefail を入れない。
          set -eu
          compile_sdk=$(sed -n 's/^compile-sdk = "\([0-9][0-9]*\)"[[:space:]]*$/\1/p' android/gradle/libs.versions.toml)
          if [ -z "$compile_sdk" ]; then
            echo "::error::コンパイル対象の Android SDK の版を、バージョンカタログから読み取れない"
            exit 1
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME が設定されていない (ランナーに Android SDK が無い)"
            exit 1
          fi
          platform_dir="${ANDROID_HOME}/platforms/android-${compile_sdk}"
          if [ -d "$platform_dir" ]; then
            echo "Android SDK Platform ${compile_sdk} はランナーにある"
            exit 0
          fi
          echo "Android SDK Platform ${compile_sdk} がランナーに無いので取得する"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager が見つからないため、Android SDK Platform ${compile_sdk} を取得できない"
            exit 1
          fi
          yes | "$sdkmanager" --install "platforms;android-${compile_sdk}"
          if [ ! -d "$platform_dir" ]; then
            echo "::error::Android SDK Platform ${compile_sdk} を取得できなかった"
            exit 1
          fi

      # artifact のときだけ、同じ run の artifact を取り込む。名前を渡した 1 つの artifact は、
      # 中身が path の直下に展開される。
      - name: Download artifact
        if: ${{ inputs.mode == 'artifact' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/consumer-artifact/maven

      # 入力は、式を本文に直に埋めずに、環境変数を通して渡す (値がシェルの構文として読まれない)。
      # version と KS_REPOSITORY が空のときは空の文字列が渡り、スクリプトは渡していないのと同じに扱う。
      # KS_REPOSITORY は、artifact のときだけ、上で取り込んだディレクトリを指す。
      # 合否はスクリプトの終了コードで決まる。後ろに別のコマンドをつなぐと、つないだ側の
      # 終了コードが step の合否になるので、つながない。
      - name: Verify consumer
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_VERSION: ${{ inputs.version }}
          KS_REPOSITORY: ${{ inputs.mode == 'artifact' && format('{0}/consumer-artifact/maven', runner.temp) || '' }}
        run: python3 scripts/ci/verify-consumer-android.py --mode "${KS_MODE}" --version "${KS_VERSION}" --repository "${KS_REPOSITORY}"
