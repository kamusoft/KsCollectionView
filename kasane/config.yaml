version: "0.1"

# プロジェクト共通の記述規約
context: |
  アーティファクトは日本語で記述する。技術用語および仕様構文キーワードは英語のまま使用する。
  本プロジェクトは UI コントロールライブラリであり、公開 API の契約と利用コード例は製品知識として価値を持つため、concepts の記述対象とする。
  内部実装フローや単なるファイル一覧は、コードから再導出できる情報として concepts へ記載しない。

# ドメイン軸 (core + platform。cross は予約ドメイン)
domains:
  core: "全 platform が共有する契約 (core-model / cells / styling / 共通 architecture)"
  ios: "iOS 系統 (ios/ ビルドルート)。UICollectionView ベースのエンジンを持ち、セル中身は UIHostingConfiguration で SwiftUI として記述する (core/ADR-0001)"
  android: "Android 系統 (android/ ビルドルート)。独自エンジンを持たず Compose Lazy 系 (LazyColumn / LazyVerticalGrid) の薄いラッパー (core/ADR-0001)"

# 用途別スキルマッピング (全ドメイン共通。platform 固有スキルは domain-skills 側へ)
skills:
  impl: []
  ui-impl: []
  test: []
  spec-review: []
  code-review: []
  domain: []

# ドメイン別スキルオーバーレイ (用途キー解決時に共通 skills へ結合される)
domain-skills:
  ios:
    impl: [swift-ui-impl-skill]
    ui-impl: [swift-ui-impl-skill]
  android:
    impl: [kotlin-impl-skill, jetpack-compose-impl-skill]
    ui-impl: [jetpack-compose-impl-skill]
    code-review: [kotlin-impl-skill]
    # test: Android 専用のテストスキルは存在しない (キーは定義しない)

# ワーカーエージェントの起動先 (references/worker-dispatch.md が参照)
# host = 自プラットフォームのサブエージェント / counterpart = 相方 CLI (ksn-counterpart 経由)
# counterpart の実装系 (impl / ui-impl / extract / live) は書き込み+ネットワーク許可の sandbox で動く
# — 外部への持ち出し経路になり得るため、そのリスクを受容できるプロジェクトのみ counterpart を選ぶ
workers:
  impl: host
  ui-impl: host        # counterpart は未検証 (視覚照合ループに画面操作が要る。codex の computer use で成立する可能性あり — 実績が出たら見直す)
  review: host         # impl を counterpart にする場合、host に残すと単独レビューもクロスモデルになる
                       # (counterpart にすると second-opinion 該当級で両レビューが相方モデルに揃い、ホスト視点が消える)
  verify: host
  scout: host
  extract: host
  live: host           # UI 調整でも counterpart 可 (結果確認はユーザーの目で行うため)
  advise: host         # 相談役 (ksn-advise)。host = 自プラットフォームの最上位モデル / counterpart = 相方 CLI の最上位モデル (メインが最上位モデルならモデル差は counterpart でのみ出る)

# クロスモデル・セカンドオピニオン (ksn-second-opinion / ksn-counterpart が参照)
second-opinion:
  code-review: [m, l]            # 実装レビューに相方レビューを並走させる級 (空リストで無効)
  spec-review: [m, l]            # 提案レビューに相方レビューを実施する級 (空リストで無効)
  counterpart: auto              # auto = ホストの逆 (Claude Code → codex / codex → claude)。名前の明示も可

# 標準 lint / hook (scripts/local-path-lint.py / identity-lint.py / log-sanitize.py)
lint:
  exclude: []                    # 全 lint 共通の除外: リポジトリ相対パスの先頭セグメントまたは glob
  identity:
    # 検査範囲。本体ソースは含めない (正当な UUID 定数があり誤検出になるため)。
    # samples は例外として含める — Xcode の実機ビルドが DEVELOPMENT_TEAM 等の
    # 開発者識別子を samples 配下のプロジェクトファイルへ書き戻すため、その捕捉が目的。
    # skills / samples はまだ存在しない (samples は各プラットフォームの基盤フェーズ、skills は
    # 配布・ドキュメントのフェーズで作られる予定) が、先に検査範囲へ入れておく。
    scope: [kasane, skills, samples]
    allow: ["@kamusoft.jp", "repo.local", "git@github.com"]      # 正当な値。@ドメインはそのドメインのメール (デモデータ) を許可
    disable: []                  # 無効化する検出群: device / developer / network / personal / secret
  internal-hosts: []             # 未公開サーバのホスト名
  doc-structure:                 # 育つ文書の構造 lint (references/doc-structure.md)。hook には登録しない
    scope: [kasane/concepts, kasane/handbook, kasane/roadmaps]  # 検査範囲 (index.md / log.md / rules.md は対象外)
    item-chars: 200              # 箇条書き 1 項目の上限字数 (超えたら段落・表の行・小節へ移す)
    section-items: 10            # 1 見出し配下のトップレベル項目数の上限 (超えたら小節へ割る)
    nest-depth: 3                # 違反となるネスト段数 (3 なら 2 段まで許す)
    heading-chars: 1200          # 見出しあたり散文字数の警告閾値 (表・コード・図は数えない)
    file-chars: 10000            # 1 ファイルの散文字数の警告閾値 (分割の検討トリガー)
  comment-policy:                # ソースコメント規約の lint / hook (opt-in — この節の存在が採用宣言。規約本文は handbook/cross/comment-policy.md、配布元は ksn-init templates/)
    exclude: []                  # 追加の対象外 (先頭セグメント or glob)。kasane/ .claude/ build/ .git/ は常に対象外
    ext: []                      # 検査対象に追加する拡張子 (既定は scripts/comment-policy-lint.py 冒頭の列挙)

drift:
  timestamp-threshold-days: 90
  deep-rotation-count: 5

orchestrator:
  max-review-cycles: 3
  parallel: false

ui:
  mock-variants: 2
  screenshot: ""

distill:
  archive-media: delete          # archive 時の媒体ファイルの扱い: delete (既定) | keep

lessons:
  promote-pain: 3                # pain (失敗) の昇格閾値 (独立した change 数)
  promote-success: 5             # success (成功) の昇格閾値
  max-rules-per-scope: 12        # scope ファイルあたりの昇格済みルール上限

evolve:
  # 所有するスキルリポジトリ (ハーネス自身も1エントリ)
  skill-repos:
    - ../Kasane    # ksn-* ハーネス本体
    - ../KsSkills  # 汎用スキル群 (csharp-impl / dotnet-test 等)
    - ../KsApp     # ksapi-ksdb-impl-skill の実体
  promote-projects: 2            # スキル反映の閾値 (昇格済みプロジェクト数)
